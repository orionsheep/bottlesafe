model_name_or_path: Qwen/Qwen3-VL-4B-Instruct
train_file: data/processed/train.jsonl
validation_file: data/processed/validation.jsonl
output_dir: outputs/chemical-safety-qwen3vl4b

seed: 42
max_length: 2048
min_pixels: 200704       # 256 * 28 * 28
max_pixels: 602112       # 768 * 28 * 28; 8GB 显存可继续降低

num_train_epochs: 3
learning_rate: 0.0001
weight_decay: 0.01
warmup_ratio: 0.05
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
logging_steps: 5
eval_steps: 100
save_steps: 100
save_total_limit: 2
gradient_checkpointing: true
bf16: true
tf32: true

load_in_4bit: true
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true
bnb_4bit_compute_dtype: bfloat16

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

